[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rlhf-gpu-training-stress-tester"
version = "0.1.0"
description = "Standalone ADMEDVOICE Whisper SFT and DPO GPU endurance tester"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_stress_tester = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
