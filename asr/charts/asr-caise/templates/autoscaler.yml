{{- range $name, $service := .Values.services }}
---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "{{ $name }}-autoscaler"
  labels:
    app: "{{ $name }}-app"
spec:
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "Deployment"
    name: "{{ $name }}-deploy"
  minReplicas: {{ $service.replication.minReplicas }}
  maxReplicas: {{ $service.replication.maxReplicas }}
  metrics:
  - type: "Resource"
    resource:
      name: "cpu"
      target:
        type: "Utilization"
        averageUtilization: {{ $service.replication.averageUtilization }}

{{- end }}
