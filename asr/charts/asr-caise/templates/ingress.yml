{{- range $name, $service := .Values.services }}
{{- if $service.publish.enabled }}
---
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: "{{ $name }}-ingress"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-cluster-issuer"
    # nginx.ingress.kubernetes.io/configuration-snippet: |
    #   add_header X-Frame-Options SAMEORIGIN;
    #   add_header X-Content-Type-Options nosniff;
    #   add_header X-XSS-Protection "1; mode=block";
    #   add_header Content-Security-Policy "frame-ancestors 'self'";
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/whitelist-source-range: "{{ $service.publish.whitelist }}"
spec:
  ingressClassName: "nginx"
  rules:
    - host: "{{ $service.publish.domain }}"
      http:
        paths:
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "{{ $name }}-service"
                port:
                  number: {{ $service.publish.port }}
  tls:
    - hosts:
        - "{{ $service.publish.domain }}"
      secretName: "{{ $name }}-certificate"
{{- end }}
{{- end }}
